[project]
name = "lansly"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.29.1",
    "aiolimiter>=1.2.1",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "cachetools>=7.1.4",
    "dishka>=1.10.1",
    "fastapi[standard]>=0.139.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "kwork>=0.2.0",
    "limits>=5.8.0",
    "openai>=2.38.0",
    "orjson>=3.11.9",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-slugify>=8.0.4",
    "redis[hiredis]>=7.4.0",
    "selectolax>=0.4.11",
    "sqlalchemy>=2.0.51",
    "starlette-admin[tinymce]>=1.0.0",
    "taskiq-redis>=1.2.3",
    "uvloop>=0.22.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "ty>=0.0.65",
]


[project.scripts]
telegram-bot="lansly.main.telegram_bot:run_polling"
lansly = "lansly.main.cli:cli"

[tool.uv]
package=true
