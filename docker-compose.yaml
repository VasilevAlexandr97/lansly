x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
  image: lansly-app:latest   # одно имя — образ собирается один раз и переиспользуется
  env_file:
    - .env

services:
  migrations:
    <<: *app-build
    restart: "no"
    command: uv run alembic upgrade head

  admin_panel:
      <<: *app-build
      stop_grace_period: 30s
      depends_on:
        migrations:
          condition: service_completed_successfully
      ports:
        - 15333:15333
      restart: unless-stopped
      command: uv run uvicorn --factory lansly.main.admin_panel:create_app --host 0.0.0.0 --port 15333 --no-server-header --proxy-headers --forwarded-allow-ips='*'

  web:
    <<: *app-build
    stop_grace_period: 30s
    depends_on:
      migrations:
        condition: service_completed_successfully
    ports:
      - 8000:8000
    restart: unless-stopped
    command: uv run uvicorn --factory lansly.main.web:create_app --host 0.0.0.0 --port 8000 --no-server-header --proxy-headers --forwarded-allow-ips='*'
  
  telegram_bot:
    # TODO: add stop grace period
    <<: *app-build
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    command: uv run telegram-bot

  worker:
    <<: *app-build
    stop_grace_period: 30s
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    command: uv run taskiq worker lansly.main.worker:broker lansly.background_tasks.tasks --workers 1

  notification_worker:
    <<: *app-build
    stop_grace_period: 60s
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    command: >-
      uv run taskiq worker
      lansly.main.notification_worker:notification_broker
      lansly.background_tasks.notification_tasks
      --workers 1
      --max-async-tasks 1
      --max-prefetch 1

  scheduler:
    <<: *app-build
    stop_grace_period: 30s
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    command: uv run taskiq scheduler lansly.main.worker:scheduler lansly.background_tasks.tasks
