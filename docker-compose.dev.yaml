x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
  image: lansly-app:latest # одно имя — образ собирается один раз и переиспользуется
  env_file:
    - .env

services:
  postgres:
    image: postgres:18-trixie
    container_name: lansly_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6.3-trixie
    container_name: lansly_redis
    env_file:
      - .env
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: redis-cli -a ${REDIS_PASSWORD} ping
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    <<: *app-build
    container_name: lansly_migrations
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: uv run alembic upgrade head

  admin_panel:
    <<: *app-build
    container_name: lansly_admin_panel
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    ports:
      - 8000:8000
    volumes:
      - ./src:/app/src
    command: uv run uvicorn --factory lansly.main.admin_panel:create_app --host 0.0.0.0 --port 8000 --reload --reload-dir src/

  web:
    <<: *app-build
    container_name: lansly_web
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    ports:
      - 8001:8001
    volumes:
      - ./src:/app/src
    command: uv run uvicorn --factory lansly.main.web:create_app --host 0.0.0.0 --port 8001 --no-server-header --proxy-headers --forwarded-allow-ips='*' --reload --reload-dir src/

  telegram_bot:
    <<: *app-build
    container_name: lansly_telegram_bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
    command: uv run telegram-bot
  worker:
    <<: *app-build
    container_name: lansly_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
    command: uv run taskiq worker lansly.main.worker:broker lansly.background_tasks.tasks --workers 1 --log-level DEBUG

  notification_worker:
    <<: *app-build
    container_name: lansly_notification_worker
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
    command: >-
      uv run taskiq worker
      lansly.main.notification_worker:notification_broker
      lansly.background_tasks.notification_tasks
      --workers 1
      --max-async-tasks 1
      --max-prefetch 1
      --log-level DEBUG

  scheduler:
    <<: *app-build
    container_name: lansly_scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
    command: uv run taskiq scheduler lansly.main.worker:scheduler lansly.background_tasks.tasks

volumes:
  pgdata:
  redis_data:
